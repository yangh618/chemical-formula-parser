# =============================================================================
# CrystalFNO external validation & novel-composition discovery — configuration
# =============================================================================
# This package does NOT train CrystalFNO or any other machine-learning model.
# CrystalFNO is used later as a frozen (pretrained) model.

# Element universe used for SMACT generation and for per-chemistry database
# enumeration. Tune to the chemistry space of interest (default: refractory /
# superalloy chemistry relevant for CrystalFNO structural prediction).
elements:
  - Al
  - Cr
  - Co
  - Mo
  - Nb
  - Ta
  - Ti
  - V
  - W
  - Zr

# SMACT generation settings -------------------------------------------------
smact:
  # Number of distinct elements per candidate formula.
  num_elements:
    - 2
    - 3
    - 4
  # Maximum stoichiometric coefficient of any element in a candidate.
  max_stoich: 8
  # Oxidation-state source. Accepted by SMACT >= 3: smact14, icsd16,
  # icsd24, pymatgen_sp, wiki, or a path to a custom file.
  oxidation_states: icsd24
  charge_neutrality: true
  # Enables/disables the Pauling electronegativity (EN) test.
  electronegativity: false
  # Treat pure elemental / all-metallic compositions as (alloy) valid.
  include_alloys: true

# Filtering settings --------------------------------------------------------
filters:
  min_elements: 2
  max_elements: 6
  max_atoms: 200
  remove_partial_occupancy: true
  remove_disordered: true

# Databases -----------------------------------------------------------------
databases:
  cod: true
  oqmd: true
  jarvis: true
  aflow: false

# Materials Project ----------------------------------------------------------
# The user already has a pretrained (MP-trained) CrystalFNO model. If a local
# MP metadata export (e.g. a .csv with a 'reduced_formula' column) is
# provided it is used for: training-set-overlap removal, formula-unseen
# external tests and novelty filtering. The pipeline works without it.
materials_project:
  metadata_file: null

# Network / IO settings ------------------------------------------------------
network:
  timeout_seconds: 60
  retries: 5
  backoff_factor: 1.5
  # Minimum seconds between requests (politeness / rate limiting).
  rate_limit_seconds: 0.35
  page_limit: 100
  # Base URLs (verified against the live services in Sep 2026). These are
  # overridable so the code does not hard-code endpoints everywhere.
  endpoints:
    cod_cif: "https://www.crystallography.net/cod/{cod_id}.cif"
    cod_optimade: "https://www.crystallography.net/cod/optimade/v1/structures"
    oqmd_optimade: "https://oqmd.org/optimade/v1/structures"
    oqmd_rest: "https://oqmd.org/oqmdapi/formationenergy"
    jarvis_optimade: "https://jarvis.nist.gov/optimade/jarvisdft/v1/structures"
    aflow_aflux: "https://aflow.org/API/aflux/"

# Ranking -------------------------------------------------------------------
ranking:
  # Modular, deterministic, heuristic ranking criteria (not machine learning).
  enabled: true
  criteria:
    - n_elements
    - stoich_complexity
    - tm_count
    - smact_validity_strength

# Composition spaces --------------------------------------------------------
# Users define their own composition spaces here. Each space specifies
# cations, anions, oxidation states, and constraints. The package provides
# generic parse / validate / generate operations over any user-defined space.
composition_spaces:

  oxychalcogenides:
    cations: [La, Ce, Pr, Nd, Sm, Eu, Gd, Ti, V, Cr, Mn, Fe, Co, Ni]
    anions: [O, S, Se, Te]
    oxidation_states:
      La: [3]
      Ce: [3, 4]
      Pr: [3, 4]
      Nd: [3]
      Sm: [2, 3]
      Eu: [2, 3]
      Gd: [3]
      Ti: [3, 4]
      V: [3, 4, 5]
      Cr: [3, 6]
      Mn: [2, 3, 4]
      Fe: [2, 3]
      Co: [2, 3]
      Ni: [2, 3]
      O: [-2]
      S: [-2]
      Se: [-2]
      Te: [-2]
    constraints:
      required_anions: [O]
      max_stoich: 8
      max_total_atoms: 20
      max_results: 5000
      # Oxychalcogenides are typically 1-3 cation systems. Capping the species
      # count keeps enumeration tractable and focuses on meaningful chemistry.
      max_cation_species: 3
      # Keep at most this many formulas per element combination, so the output
      # spans many distinct species instead of exhausting the first few
      # combinations (which are all La-only in enumeration order).
      per_combo_limit: 4

  phosphorus_chalcogenides:
    cations: [Ti, V, Cr, Mn, Fe, Co, Ni, Cu]
    anions: [P, S, Se, Te]
    oxidation_states:
      Ti: [3, 4]
      V: [3, 4, 5]
      Cr: [3, 6]
      Mn: [2, 3, 4]
      Fe: [2, 3]
      Co: [2, 3]
      Ni: [2, 3]
      Cu: [1, 2]
      P: [3, 4, 5]
      S: [-2]
      Se: [-2]
      Te: [-2]
    constraints:
      required_anions: [P]
      max_stoich: 8
      max_total_atoms: 20
      max_results: 5000
      # Transition-metal phosphorus chalcogenides are typically 1-3 cation
      # systems (e.g. TiPS3, FeCoPS). Four is allowed here to widen the pool of
      # distinct element combinations for diversity-oriented screening; lower
      # it to 3 to stay closer to experimentally established chemistry.
      max_cation_species: 4
      per_combo_limit: 6

  double_perovskites:
    cations: [La, Nd, Sm, Eu, Gd, Ca, Sr, Ba, Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Nb, Mo, W]
    anions: [O]
    oxidation_states:
      La: [3]
      Nd: [3]
      Sm: [2, 3]
      Eu: [2, 3]
      Gd: [3]
      Ca: [2]
      Sr: [2]
      Ba: [2]
      Ti: [3, 4]
      V: [3, 4, 5]
      Cr: [3, 6]
      Mn: [2, 3, 4]
      Fe: [2, 3]
      Co: [2, 3]
      Ni: [2, 3]
      Cu: [1, 2]
      Nb: [5]
      Mo: [4, 6]
      W: [6]
      O: [-2]
    constraints:
      max_stoich: 6
      max_total_atoms: 10
      max_results: 5000
      # The A2BB'O6 double perovskite framework accommodates at most four
      # distinct cation species (A, A', B, B'). Without this cap enumeration
      # walks all 2^19 cation subsets and becomes very slow.
      max_cation_species: 4
      per_combo_limit: 6
