name: crystalfno-discovery
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  # Structure / materials tooling
  - pymatgen>=2024.10.1
  - ase>=3.23
  - spglib>=2.2
  # I/O & utilities
  - requests>=2.31
  - tqdm>=4.66
  - pyyaml>=6.0
  - h5py>=3.10
  - joblib>=1.3
  # Testing
  - pytest>=7.4
  - pip:
      # SMACT is not currently packaged on conda-forge; install it via pip.
      - smact>=2.7
